name: Container kernel

# Builds the arm64 kernels Apple's `container` boots for local Linux test runs on
# macOS (eng/build-container-kernel.sh), on a native arm64 runner so nobody has to
# compile a kernel on a laptop. One job per kernel: the current one for everyday
# runs, plus the versions phase 2's cross-kernel exit criterion boots. Each result
# is uploaded as the container-kernel-<version> workflow artifact (kept 90 days;
# rerun the workflow manually to get a fresh one).

on:
  workflow_dispatch:
    inputs:
      kernels:
        description: >-
          Versions to build, as a JSON array (e.g. ["6.8.12"]). Empty builds every
          pinned version.
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - eng/build-container-kernel.sh
      - eng/kernel/**
      - .github/workflows/container-kernel.yml
  pull_request:
    paths:
      - eng/build-container-kernel.sh
      - eng/kernel/**
      - .github/workflows/container-kernel.yml

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.kernel }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false # one kernel failing to build says nothing about the others
      matrix:
        # Each needs a pinned sha256 and base config in eng/build-container-kernel.sh.
        # Pushes and PRs build all of them, since the script and fragments they touch
        # are shared; a manual run can name just the ones it needs.
        kernel: ${{ fromJSON(inputs.kernels || '["6.18.64", "6.8.12", "5.4.302"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build kernel
        run: ./eng/build-container-kernel.sh
        env:
          KERNEL_VERSION: ${{ matrix.kernel }}
      - uses: actions/upload-artifact@v4
        with:
          name: container-kernel-${{ matrix.kernel }}
          path: artifacts/kernel/
          retention-days: 90
